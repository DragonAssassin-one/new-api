apiVersion: apps/v1
kind: Deployment
metadata:
  name: new-api
  namespace: new-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: new-api
  template:
    metadata:
      labels:
        app: new-api
    spec:
      containers:
        - name: new-api
          image: calciumion/new-api:latest
          ports:
            - containerPort: 3000
          env:
            - name: SQL_DSN
              valueFrom:
                secretKeyRef:
                  name: new-api-secrets
                  key: sql-dsn
            - name: REDIS_CONN_STRING
              valueFrom:
                secretKeyRef:
                  name: new-api-secrets
                  key: redis-conn-string
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: new-api-secrets
                  key: session-secret
            - name: CRYPTO_SECRET
              valueFrom:
                secretKeyRef:
                  name: new-api-secrets
                  key: crypto-secret
            - name: TZ
              value: Asia/Shanghai
            - name: BATCH_UPDATE_ENABLED
              value: "true"
            - name: ERROR_LOG_ENABLED
              value: "true"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            httpGet:
              path: /api/status
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/status
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: new-api
  namespace: new-api
spec:
  type: LoadBalancer
  selector:
    app: new-api
  ports:
    - port: 3000
      targetPort: 3000
